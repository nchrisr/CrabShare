[package]
name = "crabshare"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Only to recognise "message too large" receive errors; keep in step with the version axum uses.
tungstenite = "0.28.0"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[lints.clippy]
# Struct fields are always written `field: value`, even when the names match (see AGENTS.md).
redundant_field_names = "allow"
# A panic from client input would end a connection task; `expect` with a reason is the project rule.
# Allowed in tests through clippy.toml.
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
