<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CrabShare</title>
        <meta name="description" content="Share text and files between your devices, straight from the browser. Coming soon.">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
        <style>
            :root {
                --bg: #f7f5f2;
                --text: #1d1b19;
                --muted: #6b665f;
                --line: #e4e0da;
                --accent: #d9502b;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #161514;
                    --text: #f1eeea;
                    --muted: #a39d95;
                    --line: #34312d;
                    --accent: #f0714a;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                line-height: 1.5;
            }

            main {
                max-width: 520px;
                padding: 48px 16px;
                text-align: center;
            }

            .crab {
                font-size: 3.5rem;
                line-height: 1;
            }

            h1 {
                margin: 16px 0 8px;
                font-size: 2.4rem;
                color: var(--accent);
            }

            .tagline {
                margin: 0 0 24px;
                font-size: 1.2rem;
            }

            .soon {
                display: inline-block;
                margin: 0 0 32px;
                padding: 6px 14px;
                border: 1px solid var(--line);
                border-radius: 999px;
                font-size: 0.85rem;
                color: var(--muted);
            }

            ul {
                list-style: none;
                margin: 0 0 32px;
                padding: 0;
                color: var(--muted);
            }

            li {
                margin: 6px 0;
            }

            a {
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <main>
            <div class="crab" aria-hidden="true">🦀</div>
            <h1>CrabShare</h1>
            <p class="tagline">Share text and files between your devices, straight from the browser.</p>
            <p class="soon">Coming soon</p>
            <ul>
                <li>No app to install, no account</li>
                <li>Files go directly from device to device</li>
                <li>Nothing you share is stored on a server</li>
            </ul>
            <p><a href="https://github.com/nchrisr/crabshare">Follow along on GitHub</a></p>
        </main>
    </body>
</html>
